name: Build and Deploy Production

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: artifact-deploy-${{ github.repository }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.image.outputs.value }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set image reference
        id: image
        shell: bash
        run: |
          image_name="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "value=${REGISTRY}/${image_name}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.value }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    name: Deploy to VPS
    needs: build
    if: vars.ARTIFACT_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Copy Compose manifests and deploy runtime image
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          APP_DIR: ${{ secrets.APP_DIR }}
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?SSH_HOST is required}"
          : "${SSH_PORT:?SSH_PORT is required}"
          : "${SSH_USER:?SSH_USER is required}"
          : "${SSH_KEY:?SSH_KEY is required}"
          : "${SSH_KNOWN_HOSTS:?SSH_KNOWN_HOSTS is required}"
          : "${APP_DIR:?APP_DIR is required}"
          : "${IMAGE:?Build image is required}"

          ssh_dir="$RUNNER_TEMP/deploy-ssh"
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$SSH_KEY" > "$ssh_dir/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/deploy_key" "$ssh_dir/known_hosts"

          ssh_options=(
            -p "$SSH_PORT"
            -i "$ssh_dir/deploy_key"
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$ssh_dir/known_hosts"
          )

          scp_options=(
            -P "$SSH_PORT"
            -i "$ssh_dir/deploy_key"
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$ssh_dir/known_hosts"
          )

          scp "${scp_options[@]}" \
            docker-compose.yml docker-compose.prod.yml \
            "$SSH_USER@$SSH_HOST:$APP_DIR/"

          app_dir_b64="$(printf '%s' "$APP_DIR" | base64 | tr -d '\n')"
          image_b64="$(printf '%s' "$IMAGE" | base64 | tr -d '\n')"

          ssh "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" \
            "APP_DIR_B64='$app_dir_b64' IMAGE_B64='$image_b64' IMAGE_VARIABLE='PORTFOLIO_SITE_LANDING_IMAGE' SERVICE='portfolio_site_landing' CONTAINER_NAME='portfolio_site_landing' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail

          APP_DIR="$(printf '%s' "$APP_DIR_B64" | base64 --decode)"
          IMAGE="$(printf '%s' "$IMAGE_B64" | base64 --decode)"
          cd "$APP_DIR"

          if [ ! -f .env ]; then
            echo "Missing production .env in $APP_DIR."
            exit 1
          fi

          compose=(docker compose -f docker-compose.yml -f docker-compose.prod.yml)
          env_backup="$(mktemp)"
          cp .env "$env_backup"
          trap 'rm -f "$env_backup"' EXIT

          get_image_value() {
            awk -v key="$1" 'index($0, key "=") == 1 { value = substr($0, length(key) + 2) } END { print value }' .env
          }

          set_image_value() {
            local key="$1"
            local value="$2"
            local temporary_env
            temporary_env="$(mktemp)"

            awk -v key="$key" -v value="$value" '
              index($0, key "=") == 1 { print key "=" value; found = 1; next }
              { print }
              END { if (!found) print key "=" value }
            ' .env > "$temporary_env"
            mv "$temporary_env" .env
          }

          restore_previous_image() {
            echo "Deployment failed; restoring the previous image."
            cp "$env_backup" .env

            if [ -z "$previous_image" ]; then
              echo "No previous image is configured; manual recovery is required."
              return 1
            fi

            "${compose[@]}" pull "$SERVICE"
            "${compose[@]}" up -d --force-recreate --no-deps "$SERVICE"
            wait_for_health
          }

          wait_for_health() {
            for attempt in {1..18}; do
              health_status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$CONTAINER_NAME" 2>/dev/null || true)"

              if [ "$health_status" = "healthy" ]; then
                return 0
              fi

              if [ "$health_status" = "unhealthy" ]; then
                echo "Container $CONTAINER_NAME is unhealthy."
                return 1
              fi

              sleep 5
            done

            echo "Timed out waiting for $CONTAINER_NAME to become healthy."
            return 1
          }

          previous_image="$(get_image_value "$IMAGE_VARIABLE")"
          set_image_value "$IMAGE_VARIABLE" "$IMAGE"

          if ! "${compose[@]}" config --quiet; then
            cp "$env_backup" .env
            exit 1
          fi

          if ! "${compose[@]}" pull "$SERVICE"; then
            cp "$env_backup" .env
            exit 1
          fi

          if ! "${compose[@]}" up -d --force-recreate --no-deps "$SERVICE"; then
            restore_previous_image || true
            exit 1
          fi

          if ! wait_for_health; then
            restore_previous_image || true
            exit 1
          fi

          echo "Deployment completed with image $IMAGE."
          REMOTE_SCRIPT
