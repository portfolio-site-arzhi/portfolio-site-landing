name: Landing CI

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Landing checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NUXT_PUBLIC_BACKEND_URL: ""
      NUXT_PUBLIC_FAIL_HARD_ON_BACKEND_ERROR: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run typecheck

      - name: Run lint
        run: npm exec -- eslint . --max-warnings=0

      - name: Run unit and component tests
        run: npm run test:run

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Build application
        run: npm run build

  docker:
    name: Landing Docker build
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare Compose environment
        run: cp .env.example .env

      - name: Validate production Compose configuration
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

      - name: Build Docker image
        run: docker build --file docker/Dockerfile --tag portfolio-site-landing:ci .
